name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python scripts/build_dds.py --jobs 3
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: node --check src/bridge_dealer/static/app.js
      - run: uv run --locked pytest -q --junitxml=artifacts/tests.xml
      - name: Verify exhaustive DDS query
        run: ./dealer success examples/four_hands_85.json --exact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/tests.xml
